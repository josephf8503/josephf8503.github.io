name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A87291: ${{ secrets.A87291 }}
          B2FB6E: ${{ secrets.B2FB6E }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A87291', '')
          sec_b = os.environ.get('B2FB6E', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- fe4471b4e634711853bf843450a5528332287eb8be29d04f -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 86f71a2d71f0a3f1bcac54af84962ad2a81e51a4db -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
